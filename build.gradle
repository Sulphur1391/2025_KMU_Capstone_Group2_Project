plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.capston'
version = '0.0.1-SNAPSHOT'
description = 'project_1009'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
	google() // Google 라이브러리를 위해 추가
}

dependencies {
	// ⭐ Redis 캐시 연동
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// ⭐ 캐싱 시스템
	implementation 'org.springframework.boot:spring-boot-starter-cache'

	// ⭐ H2 DB (테스트용)
	runtimeOnly 'com.h2database:h2'

	// ⭐ JPA + PostgreSQL
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'org.postgresql:postgresql:42.6.0'

	// ⭐ Spring 기본 기능
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-quartz'

	// ⭐ Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// ⭐ DevTools
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// ⭐ Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.projectreactor:reactor-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// ⭐ Google Calendar API 관련
	implementation 'com.google.apis:google-api-services-calendar:v3-rev20250115-2.0.0' // 존재하는 안정 버전
	implementation 'com.google.auth:google-auth-library-oauth2-http:1.23.0'
	implementation 'com.google.http-client:google-http-client-jackson2:1.44.2' // JacksonFactory 포함
}

tasks.named('test') {
	useJUnitPlatform()
}
