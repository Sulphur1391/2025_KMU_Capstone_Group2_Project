services:
  redis-cache:
    image: redis:7.2-alpine
    container_name: redis-cache
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  cloth-app:
    build: .
    container_name: cloth-app
    ports:
      - "8080:8080"
    depends_on:
      redis-cache:
        condition: service_healthy

    env_file:
      - .env

    environment:
      - spring.data.redis.host=redis-cache
      - spring.data.redis.port=6379