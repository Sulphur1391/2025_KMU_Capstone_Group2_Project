name: Flutter CI

on:
  push:
    branches: [ "UI-통합" ]
  pull_request:
    branches: [ "UI-통합" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 소스코드 체크아웃
      uses: actions/checkout@v4

    - name: Java 설치
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Flutter 설치
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.0'
        channel: 'stable'

    - name: 패키지 설치
      run: flutter pub get
      working-directory: outfit_hub

    # 테스트 단계는 지금 사용 안 함
    # - name: 테스트
    #   run: flutter test
    #   working-directory: outfit_hub

    - name: APK 빌드
      run: flutter build apk --release
      working-directory: outfit_hub

    - name: APK 업로드
      uses: actions/upload-artifact@v4
      with:
        name: capstone-apk
        path: outfit_hub/build/app/outputs/flutter-apk/app-release.apk
